{% extends 'website/base.html' %}

{% block title %}FAQs | Lead Arena{% endblock %}

{% block content %}
<div class="page-banner" style="max-width:900px; margin:0 auto;">
    <h1>Frequently Asked Questions</h1>
    {% for faq in faqs %}
        <div style="margin-top:1rem;">
            <strong>{{ faq.question }}</strong>
            <p>{{ faq.answer }}</p>
        </div>
    {% empty %}
        <p>No FAQs have been added yet.</p>
    {% endfor %}
</div>
{% endblock %}
