{% extends 'website/base.html' %}

{% block title %}Place Order | Lead Arena{% endblock %}

{% block content %}
<div class="page-banner" style="max-width:700px; margin:0 auto;">
    <h1>Place an Order</h1>
    <form method="post" class="order-form">
        {% csrf_token %}
        <div class="form-container">
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <div class="error-messages">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        <button class="btn btn-primary btn-submit" type="submit">Place Order</button>
    </form>
</div>

<style>
    .order-form {
        background-color: #f9f9f9;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    
    .form-container {
        margin-bottom: 25px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 14px;
    }
    
    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.3s;
        box-sizing: border-box;
    }
    
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
    }
    
    .error-messages {
        color: #dc3545;
        font-size: 13px;
        margin-top: 5px;
    }
    
    .btn-submit {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    
    .btn-submit:hover {
        opacity: 0.9;
    }
</style>
{% endblock %}
