{% extends 'website/base.html' %}

{% block title %}Blog | Lead Arena{% endblock %}

{% block content %}
<div class="page-banner" style="max-width:900px; margin:0 auto;">
    <h1>Blog</h1>
    {% for p in posts %}
        <div style="padding:1rem 0; border-bottom:1px solid #f1f5f9;">
            <a href="{{ p.get_absolute_url }}"><h3>{{ p.title }}</h3></a>
            <p style="color:#64748b;">{{ p.excerpt }}</p>
        </div>
    {% endfor %}
</div>
{% endblock %}
