<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="100%" height="100%">
  <defs>
    <!-- Corporate Tech Gradient (Trust Blue to Growth Emerald) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Metallic Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- ICON MARK: Precision Target & Arena Orbit -->
  <g transform="translate(10, 10)">
    <!-- Outer Precision Ring -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Arena Active Orbit (Arc) -->
    <path d="M40 4 A 36 36 0 0 1 76 40" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M40 76 A 36 36 0 0 1 4 40" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Precision Crosshairs -->
    <line x1="40" y1="14" x2="40" y2="22" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="40" y1="58" x2="40" y2="66" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="40" x2="22" y2="40" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />
    <line x1="58" y1="40" x2="66" y2="40" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Inner Radar Target Ring -->
    <circle cx="40" cy="40" r="20" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.4" />
    
    <!-- Focal Lead Point (Central Node) -->
    <circle cx="40" cy="40" r="8" fill="url(#brandGrad)" />
    <circle cx="40" cy="40" r="3" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY: Clean Enterprise Style -->
  <text x="108" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#0F172A" letter-spacing="-1">LEADS</text>
  <text x="238" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="38" fill="url(#brandGrad)" letter-spacing="-0.5">ARENA</text>
  
  <!-- Sleek Structural Accent Bar -->
  <rect x="110" y="68" width="220" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.85" />
</svg>
