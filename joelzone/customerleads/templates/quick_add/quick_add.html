{% extends "base.html" %}
{% load static humanize %}

{% block title %}Quick Add - CRM{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h2 class="mb-0 section-title">Quick Add</h2>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
    </div>

    <div class="row g-4 justify-content-center">
        <div class="col-md-6 col-lg-3">
            <a href="{% url 'lead_create' %}" class="text-decoration-none">
                <div class="card dashboard-card shadow-custom h-100 p-4 text-center quick-tile">
                    <div class="quick-icon bg-primary mx-auto"><i class="fas fa-user-plus"></i></div>
                    <h6 class="fw-bold mt-3 mb-0">New Lead</h6>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <a href="{% url 'task_create' %}" class="text-decoration-none">
                <div class="card dashboard-card shadow-custom h-100 p-4 text-center quick-tile">
                    <div class="quick-icon bg-success mx-auto"><i class="fas fa-tasks"></i></div>
                    <h6 class="fw-bold mt-3 mb-0">New Task</h6>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <a href="{% url 'interaction_create' %}" class="text-decoration-none">
                <div class="card dashboard-card shadow-custom h-100 p-4 text-center quick-tile">
                    <div class="quick-icon bg-info mx-auto"><i class="fas fa-phone"></i></div>
                    <h6 class="fw-bold mt-3 mb-0">Log Interaction</h6>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <a href="{% url 'sales_pipeline' %}" class="text-decoration-none">
                <div class="card dashboard-card shadow-custom h-100 p-4 text-center quick-tile">
                    <div class="quick-icon bg-warning mx-auto"><i class="fas fa-briefcase"></i></div>
                    <h6 class="fw-bold mt-3 mb-0">New Deal</h6>
                </div>
            </a>
        </div>
    </div>

    <div class="card dashboard-card shadow-custom mt-4">
        <div class="card-header bg-white border-bottom py-3 px-4">
            <h6 class="fw-bold mb-0"><i class="fas fa-bolt me-2 text-primary"></i>Quick Lead Entry</h6>
        </div>
        <div class="card-body p-4">
            <form method="get" action="{% url 'lead_create' %}">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Lead name">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold">Phone</label>
                        <input type="text" name="phone" class="form-control" placeholder="+254...">
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100 px-4">
                            <i class="fas fa-arrow-right me-2"></i> Continue
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .quick-tile { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .quick-tile:hover { transform: translateY(-4px); }
    .quick-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.4rem; }
</style>
{% endblock %}
