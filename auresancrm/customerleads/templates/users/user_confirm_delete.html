{% extends "base.html" %}

{% block title %}Delete User{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <h2>Delete User</h2>
    
    <div class="card dashboard-card shadow-custom">
        <div class="card-body">
            <h4>Are you sure you want to delete "{{ object.get_full_name|default:object.username }}"?</h4>
            <p class="text-danger">This action cannot be undone.</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Yes, Delete User</button>
                <a href="{% url 'user_management' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
