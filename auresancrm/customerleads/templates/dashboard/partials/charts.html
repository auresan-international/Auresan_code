<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
    <h1 style="font-size: 1.6rem; font-weight: 600; margin: 0; color: #0f172a;">Operator activity chart</h1>
</div>

<div class="metric-card" style="padding: 1.5rem;">
    <div style="display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: center;">
        <div style="display: flex; justify-content: center;">
            <div style="width: 240px; height: 240px; border-radius: 50%; background: {{ chart_data.style }}; box-shadow: inset 0 0 0 16px rgba(255,255,255,0.9); position: relative;">
                <div style="position: absolute; inset: 34px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; color: #0f172a;">
                    <strong style="font-size: 1.2rem;">{{ chart_data.total }}</strong>
                    <span style="font-size: 0.85rem; color: #64748b;">Activity buckets</span>
                </div>
            </div>
        </div>

        <div>
            <h3 style="margin-bottom: 0.75rem; color: #0f172a;">Daily productivity mix</h3>
            <ul style="list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem;">
                {% for item in chart_data.stats %}
                    <li style="display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.6rem 0.8rem; background: #f8fafc; border-radius: 8px;">
                        <span style="display: inline-flex; align-items: center; gap: 0.5rem; color: #334155;">
                            <span style="width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: {{ item.color }};"></span>
                            {{ item.label }}
                        </span>
                        <strong style="color: #0f172a;">{{ item.percentage }}%</strong>
                    </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
