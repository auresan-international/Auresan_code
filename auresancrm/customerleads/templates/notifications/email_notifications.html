{% extends "base.html" %}
{% load static humanize %}

{% block title %}Email Notifications - CRM{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h2 class="mb-0 section-title">Email Notifications</h2>
        <button class="btn btn-primary px-4"><i class="fas fa-paper-plane me-2"></i> Send Test Email</button>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card dashboard-card shadow-custom h-100">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <h6 class="fw-bold mb-0"><i class="fas fa-cog me-2 text-primary"></i>Notification Preferences</h6>
                </div>
                <div class="card-body p-4">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="newLead" checked>
                        <label class="form-check-label fw-semibold" for="newLead">New lead assigned to me</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="taskDue" checked>
                        <label class="form-check-label fw-semibold" for="taskDue">Task due reminders</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="dealWon">
                        <label class="form-check-label fw-semibold" for="dealWon">Deal won / lost alerts</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="weekly">
                        <label class="form-check-label fw-semibold" for="weekly">Weekly performance summary</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="mentions">
                        <label class="form-check-label fw-semibold" for="mentions">Mentions & comments</label>
                    </div>
                    <div class="mt-4 border-top pt-3 text-end">
                        <button class="btn btn-primary px-4">Save Preferences</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card dashboard-card shadow-custom h-100">
                <div class="card-header bg-white border-bottom py-3 px-4">
                    <h6 class="fw-bold mb-0"><i class="fas fa-envelope-open-text me-2 text-success"></i>Email Templates</h6>
                </div>
                <div class="card-body p-4">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item px-0 d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-handshake me-2 text-primary"></i>Welcome Email</span>
                            <span class="badge bg-success">Active</span>
                        </div>
                        <div class="list-group-item px-0 d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-phone me-2 text-info"></i>Callback Requested</span>
                            <span class="badge bg-success">Active</span>
                        </div>
                        <div class="list-group-item px-0 d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-trophy me-2 text-warning"></i>Deal Won</span>
                            <span class="badge bg-secondary">Inactive</span>
                        </div>
                        <div class="list-group-item px-0 d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-exclamation-triangle me-2 text-danger"></i>Overdue Task</span>
                            <span class="badge bg-success">Active</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
