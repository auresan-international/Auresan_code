
{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Confirm Delete</h4>
                </div>
                <div class="card-body">
                    <p class="lead">Are you sure you want to delete the lead: <strong>{{ object.first_name }} {{ object.last_name }}</strong>?</p>
                    <p class="text-muted text-sm">This action cannot be undone.</p>
                </div>
                <div class="card-footer d-flex justify-content-between bg-light">
                    <a href="{% url 'lead_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
                    
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Confirm Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
